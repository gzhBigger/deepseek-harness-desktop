<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:" />
<title>MCP 与 Skills</title>
<script>
  (() => {
    try {
      const saved = localStorage.getItem('dsh-ui-theme')
      const preferred = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : preferred
    } catch {
      document.documentElement.dataset.theme = 'dark'
    }
  })()
</script>
<style>
  :root {
    --bg: #ffffff; --fg: #1c1e21; --muted: #6b7280; --line: #e5e7eb; --panel: #f7f8fa;
    --brand: #2f6feb; --danger: #d9453d; --ok: #1a7f37; --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* One flex column: header and footer keep their natural height and `main` is the only vertical
     scroller. A hard-coded viewport height here let a tall form push the footer out of the window. */
  body {
    margin: 0; display: flex; flex-direction: column;
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); font-size: 13px;
  }
  header { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 18px 0; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-left: auto; }
  .tabs button { border: 1px solid var(--line); background: var(--bg); color: var(--muted); padding: 5px 14px; border-radius: 7px; cursor: pointer; font: inherit; }
  .tabs button.active { border-color: var(--brand); color: var(--brand); background: #eef3ff; }
  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 18px 8px; display: flex; flex-direction: column; gap: 10px; }
  /* Natural height: a tall panel grows and `main` scrolls, instead of being squeezed into a fixed box. */
  .panel { display: none; flex-direction: column; gap: 10px; flex: 0 0 auto; }
  .panel.active { display: flex; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar .path { color: var(--muted); font-size: 11px; margin-left: auto; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); padding: 5px 12px; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.danger { color: var(--danger); border-color: #f0c8c5; }
  button.small { padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  ::placeholder { color: #9aa1ab; }
  /* No scrollbar of its own: cards and the form scroll once, together with `main`. */
  .scroll { display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .card { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--bg); display: flex; gap: 10px; align-items: flex-start; }
  .card.disabled { opacity: .55; }
  .card .grow { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card .summary { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .desc { color: var(--muted); margin-top: 3px; }
  .tag { display: inline-block; font-size: 10.5px; border-radius: 999px; padding: 1px 8px; background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
  .tag.ok { color: var(--ok); border-color: #bfe3c8; background: #effaf1; }
  .tag.legacy { color: #9a6700; border-color: #ecd9a8; background: #fff8e6; }
  /* Availability status: one badge line plus one error line; the full error lives in the title. */
  .card .probe { margin-top: 7px; display: flex; flex-direction: column; gap: 3px; }
  .probe-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 10.5px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: #bfe3c8; background: #effaf1; }
  .badge.error { color: var(--danger); border-color: #f0c8c5; background: #fff3f2; }
  .badge.busy { color: var(--brand); border-color: #c9d8ff; background: #eef3ff; }
  .probe-time { color: var(--muted); font-size: 11px; }
  .probe-error { color: var(--danger); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; }
  .hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .scopebar { display: flex; flex-wrap: wrap; gap: 6px; }
  .scopebar:empty { display: none; }
  .scopebar button { padding: 4px 10px; border-radius: 999px; font-size: 12px; }
  .scopebar button.active { border-color: var(--accent); color: var(--accent); background: #eef6ff; }
  .scope-head { display: flex; align-items: center; gap: 6px; margin: 16px 0 2px; color: var(--muted); font-size: 12px; }
  .skill-group { display: flex; flex-direction: column; gap: 8px; }
  .skill-group .card { border-left: 3px solid #e4e8ef; }
  .skill-group .card:hover { border-color: #c9d8ff; }
  .card .actions { flex-wrap: wrap; justify-content: flex-end; }
  .scope-head code { font-size: 11px; }
  .check { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.5; }
  .market-detail { border: 1px solid var(--line); border-radius: 9px; padding: 14px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
  .market-modal { width: min(760px, 100%); max-height: 88vh; border: 0; padding: 0; background: transparent; }
  .market-modal::backdrop { background: rgba(0, 0, 0, .45); }
  .market-modal .market-detail { max-height: 84vh; overflow-y: auto; box-shadow: 0 16px 40px rgba(0, 0, 0, .25); }
  .market-detail .command { display: flex; gap: 6px; align-items: center; }
  .market-detail .command code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, Consolas, monospace; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .market-metrics { color: var(--muted); font-size: 12px; }
  .publication { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; color: var(--muted); font-size: 11.5px; }
  .publication code { overflow-wrap: anywhere; }
  .source-badge { margin-top: 4px; color: var(--muted); font-size: 11px; }
  .form { border: 1px solid var(--line); border-radius: 9px; padding: 12px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
  .form[hidden] { display: none; }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row > label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 12px; }
  /* Checkbox rows are one control plus its text: the generic column layout stacked the tick above
     the label and split the row in half. Keep them inline and at their natural width. */
  .row > label.check { flex: 0 0 auto; flex-direction: row; align-items: center; gap: 6px; color: var(--fg); font-size: 12.5px; }
  .row > label.check input { flex: none; margin: 0; }
  input[type="text"], select, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--fg); }
  textarea { min-height: 54px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .command-line { display: flex; align-items: center; gap: 6px; }
  .command-line input { flex: 1; min-width: 0; }
  #nodeHint { margin: -2px 0 0; color: var(--muted); font-size: 11.5px; line-height: 1.55; overflow-wrap: anywhere; }
  #nodeHint[hidden] { display: none; }
  .form .buttons { display: flex; gap: 8px; justify-content: flex-end; }
  footer { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 18px 14px; border-top: 1px solid var(--line); }
  footer button { flex-shrink: 0; }
  #statusBar { color: var(--muted); flex: 1 1 240px; min-width: 0; min-height: 18px; overflow-wrap: anywhere; }
  #statusBar.error { color: var(--danger); }
  #statusBar.ok { color: var(--ok); }

  /* ── import modal (Codex / Claude configuration) ───────────────────── */
  .modal-mask {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .45);
  }
  /* The mask is a flex container, so the UA's [hidden] rule loses to it: without this the
     dialog is visible (and blocking the window) from the first paint. */
  .modal-mask[hidden] { display: none; }
  .modal {
    width: min(720px, 100%); max-height: 88vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); box-shadow: 0 16px 40px rgba(0, 0, 0, .25);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .modal-head h2 { margin: 0; font-size: 15px; }
  .modal .hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  button.icon { border: 0; font-size: 18px; line-height: 1; padding: 2px 8px; color: var(--muted); }
  #importText { min-height: 150px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .import-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .import-actions .grow { flex: 1 1 auto; }
  #importStatus { color: var(--muted); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
  #importStatus.error { color: var(--danger); }
  #importStatus.ok { color: var(--ok); }
  .import-preview { display: flex; flex-direction: column; gap: 8px; }
  .import-item {
    display: flex; flex-direction: column; gap: 4px;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel);
  }
  .import-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; cursor: pointer; }
  .import-head input { flex: none; margin: 0; }
  .import-name { font-weight: 600; }
  .import-target { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .import-conflict { display: flex; align-items: center; gap: 6px; color: var(--warn); font-size: 11.5px; }
  .import-warnings { margin: 0; padding-left: 18px; color: var(--warn); font-size: 11.5px; line-height: 1.55; }
  .import-errors { margin: 0; padding-left: 18px; color: var(--danger); font-size: 12px; line-height: 1.6; }
  .import-warning { margin: 0; color: var(--warn); font-size: 12px; line-height: 1.6; }
  .import-empty { margin: 0; color: var(--muted); font-size: 12px; }

  /* ── 2026 control-plane refresh ──────────────────────────────────────────
     Same visual language as the plugin market: deep graphite surfaces, a
     mint accent for the active state, and a card grid that makes the window
     feel like a workspace instead of a long settings form. */
  :root {
    --bg: oklch(15.5% 0.018 255);
    --bg-deep: oklch(12.5% 0.018 255);
    --fg: oklch(96% 0.008 255);
    --fg-2: oklch(84% 0.014 255);
    --muted: oklch(70% 0.018 255);
    --faint: oklch(57% 0.02 255);
    --line: oklch(31% 0.02 255);
    --line-soft: oklch(25% 0.016 255);
    --panel: oklch(19% 0.016 255);
    --surface: oklch(21% 0.017 255);
    --surface-2: oklch(25% 0.018 255);
    --brand: oklch(82% 0.16 166);
    --accent: oklch(82% 0.16 166);
    --accent-ink: oklch(17% 0.03 166);
    --ok: oklch(80% 0.14 155);
    --warn: oklch(84% 0.12 86);
    --danger: oklch(72% 0.15 24);
    color-scheme: dark;
  }
  html, body { background: var(--bg); }
  body {
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    color: var(--fg); font-size: 13.5px;
    background: var(--bg);
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 21px 24px 16px; border-block-end: 1px solid var(--line-soft);
    background: var(--bg);
  }
  header::before {
    content: ""; inline-size: 34px; block-size: 34px; flex: none; border-radius: 11px;
    background: var(--accent);
    box-shadow: 0 0 0 1px oklch(100% 0 0 / .12) inset;
    position: relative;
  }
  h1 {
    display: flex; flex-direction: column; gap: 3px;
    margin: 0; font-size: 18px; font-weight: 680; letter-spacing: -.02em; line-height: 1.1;
  }
  h1::after {
    content: "MCP · SKILLS · MARKET"; color: var(--faint);
    font: 600 9.5px/1.2 ui-monospace, Consolas, monospace; letter-spacing: .16em;
  }
  .tabs {
    display: flex; gap: 3px; margin-inline-start: auto; padding: 4px;
    border-radius: 999px; background: oklch(18% 0.014 255 / .92);
    box-shadow: 0 0 0 1px var(--line-soft) inset;
  }
  .tabs button {
    border: 0; background: transparent; color: var(--muted);
    padding: 7px 14px; border-radius: 999px; font-weight: 550;
  }
  .tabs button:hover { color: var(--fg); }
  .tabs button.active {
    background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 0 0 1px oklch(100% 0 0 / .12) inset;
  }
  main {
    min-block-size: 0; overflow: auto; padding: 20px 24px 20px;
    gap: 14px; scrollbar-gutter: stable;
  }
  .panel { gap: 12px; }
  .toolbar { gap: 8px; }
  .toolbar .path { color: var(--faint); }
  button {
    color: var(--fg); background: var(--surface-2); border-color: var(--line-soft);
    border-radius: 8px; min-block-size: 31px;
    transition: border-color 140ms cubic-bezier(.2,.7,.3,1), background 140ms cubic-bezier(.2,.7,.3,1), transform 140ms cubic-bezier(.2,.7,.3,1);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
  button.danger { color: var(--danger); border-color: oklch(48% 0.12 24); }
  .scroll { gap: 12px; }
  #serverList {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px; align-items: stretch; grid-auto-flow: dense;
  }
  #serverList .card { flex-direction: column; align-items: stretch; block-size: 100%; }
  #serverList .card .actions { justify-content: flex-end; padding-block-start: 4px; }
  #skillList { display: flex; flex-direction: column; gap: 18px; }
  .skill-group {
    display: block; column-width: 270px; column-gap: 10px;
  }
  .skill-group .scope-head { column-span: all; margin: 0 0 8px; }
  .skill-group .card {
    display: flex; flex-direction: column; align-items: stretch;
    inline-size: 100%; break-inside: avoid; margin-block-end: 10px;
    border-inline-start: 3px solid var(--line);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line-soft); border-radius: 13px; padding: 14px;
    box-shadow: 0 1px 0 oklch(100% 0 0 / .03) inset;
  }
  .card:hover { border-color: oklch(42% 0.035 220); }
  .card .name { font-size: 13.5px; }
  .card .summary { color: var(--faint); }
  .card .desc { color: var(--muted); line-height: 1.6; }
  .card .actions { flex-wrap: wrap; justify-content: flex-end; }
  .tag { background: var(--surface-2); border-color: var(--line-soft); color: var(--muted); }
  .tag.ok, .badge.ok { color: var(--ok); border-color: oklch(45% 0.08 155); background: oklch(24% 0.04 155); }
  .tag.legacy, .badge.error { color: var(--warn); border-color: oklch(45% 0.08 86); background: oklch(24% 0.035 86); }
  .badge { background: var(--surface-2); border-color: var(--line-soft); color: var(--muted); }
  .badge.busy { color: var(--accent); border-color: oklch(45% 0.08 166); background: oklch(24% 0.04 166); }
  :root[data-theme="light"] .tag.ok,
  :root[data-theme="light"] .badge.ok { color: oklch(38% 0.12 155); border-color: oklch(82% 0.07 155); background: oklch(94% 0.04 155); }
  :root[data-theme="light"] .tag.legacy,
  :root[data-theme="light"] .badge.error { color: oklch(42% 0.1 80); border-color: oklch(84% 0.06 80); background: oklch(96% 0.035 80); }
  :root[data-theme="light"] .badge.busy { color: oklch(38% 0.12 166); border-color: oklch(82% 0.06 166); background: oklch(95% 0.03 166); }
  .hint { color: var(--muted); }
  .scopebar button { background: var(--surface); }
  .scopebar button.active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .scope-head { color: var(--faint); }
  #marketResults {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 10px; align-items: start;
  }
  #marketResults > .card { flex-direction: column; align-items: stretch; }
  .form {
    background: var(--panel); border-color: var(--line-soft); border-radius: 13px;
  }
  input[type="text"], select, textarea {
    background: var(--bg-deep); color: var(--fg); border-color: var(--line-soft);
  }
  input[type="text"]:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  ::placeholder { color: var(--faint); }
  .market-modal { border-radius: 18px; }
  .market-modal::backdrop { background: oklch(7% 0.015 255 / .7); backdrop-filter: blur(5px); }
  .market-detail {
    background: var(--surface); border-color: var(--line); border-radius: 18px;
    box-shadow: 0 24px 80px oklch(5% 0.02 255 / .55);
  }
  .market-detail .command code, .market-detail code {
    background: var(--bg-deep); border-color: var(--line-soft); color: var(--fg);
  }
  .modal-mask { background: oklch(7% 0.015 255 / .7); backdrop-filter: blur(4px); }
  .modal { background: var(--surface); border-color: var(--line); border-radius: 18px; }
  .import-item { background: var(--panel); border-color: var(--line-soft); }
  footer {
    padding: 13px 24px; border-block-start: 1px solid var(--line-soft);
    background: oklch(13% 0.018 255 / .82); backdrop-filter: blur(14px);
  }
  #statusBar { color: var(--muted); }
  .theme-toggle {
    flex: none; inline-size: 32px; block-size: 32px; padding: 0;
    border-radius: 50%; color: var(--muted); background: var(--surface);
    border: 1px solid var(--line-soft); font-size: 15px; line-height: 1;
  }
  .theme-toggle:hover { color: var(--fg); border-color: var(--accent); }

  /* Light mode. Follows the OS until the header toggle is used. */
  :root[data-theme="light"] {
    --bg: oklch(98% 0.004 250);
    --bg-deep: oklch(95% 0.006 250);
    --fg: oklch(24% 0.018 250);
    --fg-2: oklch(38% 0.018 250);
    --muted: oklch(50% 0.018 250);
    --faint: oklch(60% 0.016 250);
    --line: oklch(84% 0.01 250);
    --line-soft: oklch(91% 0.008 250);
    --panel: oklch(96.5% 0.006 250);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(96.5% 0.006 250);
    --brand: oklch(52% 0.16 265);
    --accent: oklch(62% 0.14 166);
    --accent-ink: oklch(99% 0.004 166);
    --ok: oklch(48% 0.13 155);
    --warn: oklch(55% 0.13 80);
    --danger: oklch(52% 0.17 25);
    color-scheme: light;
  }
  :root[data-theme="light"] body { background: var(--bg); }
  :root[data-theme="light"] header { background: var(--bg); }
  :root[data-theme="light"] .tabs { background: oklch(93% 0.008 250 / .95); }
  :root[data-theme="light"] footer { background: oklch(96% 0.006 250 / .9); }
  :root[data-theme="light"] .card {
    background: var(--surface);
    box-shadow: 0 1px 0 oklch(100% 0 0 / .8) inset, 0 8px 24px oklch(30% 0.02 250 / .06);
  }
  :root[data-theme="light"] .card:hover { border-color: var(--line); }
  :root[data-theme="light"] .market-modal::backdrop { background: oklch(30% 0.02 255 / .35); }

  @media (max-width: 900px) {
    .app, body { grid-template-columns: 1fr; }
    header { padding-inline: 18px; }
    main { padding-inline: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <header>
    <h1>MCP 与 Skills</h1>
    <div class="tabs">
      <button type="button" id="tabMcp" class="active">MCP 服务</button>
      <button type="button" id="tabSkills">Skills</button>
      <button type="button" id="tabMarket">Skill 市场</button>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换主题" title="切换主题">☀</button>
  </header>

  <main>
    <section class="panel active" id="panelMcp">
      <div class="toolbar">
        <button type="button" class="primary" id="addServer">新增 MCP</button>
        <button type="button" id="importMcp">导入配置</button>
        <button type="button" id="refreshMcp">刷新</button>
        <button type="button" id="checkAll" disabled>检查全部</button>
        <span class="path" id="patchPath"></span>
      </div>
      <div class="form" id="serverForm" hidden>
        <div class="row">
          <label>服务名<input type="text" id="serverName" placeholder="jenkins_dev" /></label>
          <label>传输
            <select id="serverTransport">

          <label>参数（每行一个）<textarea id="serverArgs" placeholder="G:\nodejs\node_global\node_modules\@raviraj87\jenkins-mcp\dist\index.js"></textarea></label>

        <div class="row" id="stdioEnvRow">
          <label>环境变量（KEY=VALUE，每行一个）<textarea id="serverEnv" placeholder="JENKINS_URL=http://10.0.0.5:8080"></textarea></label>

    <section class="panel" id="panelSkills">

  <footer>
    <span id="statusBar">配置保存后需要重启 DSH 才能生效。</span>

    <button type="button" id="closeButton">关闭</button>

  <!-- Import: paste or pick a Codex / Claude configuration, preview it, then write the selection.
       The textarea and preview are plain DOM; nothing here fetches or writes markup. -->

  <div class="modal-mask" id="installModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="installTitle">
      <div class="modal-head">
        <h2 id="installTitle">安装 Skill</h2>
        <button class="icon" id="installClose" type="button" aria-label="关闭">×</button>
      </div>
      <p class="hint" id="installSkillName"></p>
      <p class="hint">技能正文会进入模型上下文，目录里可能包含 scripts 或其他资源；安装只下载文件，不会执行任何脚本。</p>
      <label>安装到
        <select id="installScope"></select>
      </label>
      <label class="check"><input type="checkbox" id="installTrust" /> 我确认信任这个技能，并同意把文件加入本地库并发布到所选作用域。</label>
      <div class="modal-actions">
        <button type="button" id="installCancel">取消</button>
        <button type="button" class="primary" id="installConfirm" disabled>安装</button>
      </div>

  <script>
    const api = window.__DSH_MCP__
    const $ = (id) => document.getElementById(id)

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme
      const button = $('themeToggle')
      button.textContent = theme === 'light' ? '☾' : '☀'
      button.title = theme === 'light' ? '切换到深色' : '切换到浅色'
      button.setAttribute('aria-label', button.title)
    }

    applyTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark')
    $('themeToggle').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
      try { localStorage.setItem('dsh-ui-theme', next) } catch {}
      applyTheme(next)
    })
    let editingId = null
    let servers = []
    // The Node executable the shell detected (empty when there is none). `nodeLoaded` lets the hint
    // say "正在检测" instead of claiming "未找到" during the first IPC round trip.
    let nodePath = ''
    let nodeSource = 'missing'
    let nodeLoaded = false
    // Availability checks live on the server rows (`server.probe`); the sets here are transient UI
    // state — which ids are running right now, and the "check all" batch progress. `autoCheckStarted`
    // makes the first render check enabled servers once in the background: the requirement is that
    // the list *shows* whether each server is usable, not that the user has to find the button.
    const PROBE_ERROR_LINE_LIMIT = 240
    const probeState = { checking: new Set(), batchRunning: false, batchDone: 0, batchTotal: 0 }
    let autoCheckStarted = false
    // Set by an import so its own summary is not overwritten by the background "已自动检查…" line.
    let autoCheckQuiet = false
    // The last parse result shown in the import modal; selection state lives in the preview DOM.
    const importState = { result: null, applying: false }

    function setStatus(text, kind) {
      const bar = $('statusBar')
      bar.textContent = text || ''
      bar.className = kind || ''
    }

    function el(tag, className, text) {
      const node = document.createElement(tag)
      if (className) node.className = className
      if (text !== undefined) node.textContent = text
      return node
    }

    function tag(text, className) {
      const node = el('span', 'tag' + (className ? ' ' + className : ''), text)
      return node
    }

    function parseLines(text, separator) {
      const out = []
      for (const line of String(text || '').split(/\r?\n/)) {
        const trimmed = line.trim()
        if (trimmed === '') continue
        const index = trimmed.indexOf(separator)
        if (index <= 0) continue
        out.push([trimmed.slice(0, index).trim(), trimmed.slice(index + separator.length).trim()])
      }
      return out
    }

    function pairsToObject(pairs) {
      const out = {}
      for (const [key, value] of pairs) out[key] = value
      return out
    }

    function objectToLines(object, separator) {
      if (!object) return ''
      return Object.keys(object).map((key) => key + separator + object[key]).join('\n')
    }

    function renderNodeHint() {
      const hint = $('nodeHint')
      if ($('serverTransport').value !== 'stdio') {
        hint.hidden = true
        return
      }
      if (!nodeLoaded) {
        hint.textContent = '正在检测内置 Node…'
      } else if (nodePath === '') {
        hint.textContent = '未找到内置 Node，仍可手动填写或留空使用 PATH 中的 node。'
      } else {
        const origin = nodeSource === 'environment' ? '环境变量指定的' : '随包'
        hint.textContent = '已自动使用' + origin + ' Node：' + nodePath + '；MCP 服务器通常由 Node 启动，可改。'
      }
      hint.hidden = false
    }

    /** Fill the command only when the field carries no real choice (empty or the bare `node`). */
    function fillNodeCommand() {
      if (nodePath === '') return
      const field = $('serverCommand')
      const current = field.value.trim()
      if (current === '' || /^(?:node|node\.exe)$/i.test(current)) field.value = nodePath
    }

    /** Save-time normalization mirrors the shell's fallback, so the form shows what will be written. */
    function normalizeCommand(value) {
      const command = String(value || '').trim()
      if (nodePath === '') return command
      if (command === '' || /^(?:node|node\.exe)$/i.test(command)) return nodePath
      return command
    }

    async function loadNode() {
      if (!api || typeof api.node !== 'function') {
        nodePath = ''
        nodeSource = 'missing'
        nodeLoaded = true
        renderNodeHint()
        return
      }
      try {
        const info = await api.node()
        // `exists: false` (the runtime was moved while the window was open) counts as not found.
        nodePath = info && typeof info.path === 'string' && info.exists !== false ? info.path : ''
        nodeSource = info && typeof info.source === 'string' ? info.source : (nodePath === '' ? 'missing' : 'bundled')
      } catch (error) {
        nodePath = ''
        nodeSource = 'missing'
      }
      nodeLoaded = true
      renderNodeHint()
      // The window may have opened the form while the detection was still in flight.
      if (!$('serverForm').hidden) fillNodeCommand()
    }

    async function detectNode() {
      setStatus('正在检测内置 Node…')
      await loadNode()
      if (nodePath === '') {
        setStatus('未找到内置 Node，仍可手动填写或留空使用 PATH 中的 node。', 'error')
        return
      }
      $('serverCommand').value = nodePath
      renderNodeHint()
      setStatus('已填入 Node 路径。', 'ok')
    }

    function describe(server) {
      if (server.transport === 'streamable-http') return server.url || ''
      const args = (server.args || []).join(' ')
      return server.command + (args ? ' ' + args : '')
    }

    /** One line in the card; the parent node keeps the full text in `title`. */
    function truncateProbeError(value) {
      const text = String(value || '')
      return text.length <= PROBE_ERROR_LINE_LIMIT ? text : text.slice(0, PROBE_ERROR_LINE_LIMIT) + '…'
    }

    function probeTimeText(result) {
      const at = result ? Number(result.checkedAt) : Number.NaN
      if (!Number.isFinite(at) || at <= 0) return ''
      const date = new Date(at)
      return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0') + ' 检查'
    }

    function probeBadge(server) {
      if (probeState.checking.has(server.id)) return el('span', 'badge busy', '检查中…')
      const result = server.probe
      if (!result) return el('span', 'badge', '未检查')
      if (result.ok === true) {
        const count = Number(result.toolCount)
        return el('span', 'badge ok', '可用 · ' + (Number.isFinite(count) ? count : 0) + ' 个工具')
      }
      return el('span', 'badge error', '不可用')
    }

    function syncCheckAllButton() {
      const button = $('checkAll')
      if (probeState.batchRunning) {
        button.textContent = '检查中 ' + probeState.batchDone + '/' + probeState.batchTotal + '…'
        button.disabled = true
        return
      }
      button.textContent = '检查全部'
      button.disabled = servers.length === 0 || !api || typeof api.check !== 'function'
    }

    function applyProbeResult(id, result) {
      const index = servers.findIndex((server) => server.id === id)
      if (index < 0) return
      servers[index] = { ...servers[index], probe: result }
    }

    function renderServers() {
      const list = $('serverList')
      list.replaceChildren()
      if (servers.length === 0) {
        list.append(el('div', 'empty', '还没有 MCP 服务。点左上角「新增 MCP」添加。'))
        syncCheckAllButton()
        return
      }
      for (const server of servers) {
        const card = el('div', 'card' + (server.enabled ? '' : ' disabled'))
        const grow = el('div', 'grow')
        const name = el('div', 'name', server.serverName)
        name.append(tag(server.transport))
        if (server.legacy) name.append(tag('来自旧插件', 'legacy'))
        if (!server.enabled) name.append(tag('已停用'))
        grow.append(name)
        grow.append(el('div', 'summary', describe(server)))
        if (server.transport === 'stdio' && server.env) {
          grow.append(el('div', 'desc', '环境变量：' + Object.keys(server.env).join('、')))
        }
        // Availability: badge + last-check time, and the failure reason on its own line. The title
        // carries the full (shell-truncated) error because the line is ellipsized.
        const probe = el('div', 'probe')
        const probeLine = el('div', 'probe-line')
        probeLine.append(probeBadge(server))
        const checkedText = probeTimeText(server.probe)
        if (checkedText !== '') probeLine.append(el('span', 'probe-time', checkedText))
        probe.append(probeLine)
        if (server.probe && server.probe.ok !== true && server.probe.error) {
          const errorLine = el('div', 'probe-error', truncateProbeError(server.probe.error))
          errorLine.title = String(server.probe.error)
          probe.append(errorLine)
        }
        grow.append(probe)
        card.append(grow)
        const actions = el('div', 'actions')
        // Disabled/legacy rows stay checkable: their configuration may still connect.
        const check = el('button', 'small', probeState.checking.has(server.id) ? '检查中…' : '检查')
        check.disabled = probeState.checking.has(server.id) || probeState.batchRunning || !api || typeof api.check !== 'function'
        check.addEventListener('click', () => { void checkOne(server.id) })
        const toggle = el('button', 'small', server.enabled ? '停用' : '启用')
        toggle.addEventListener('click', () => { void setEnabled(server.id, !server.enabled) })
        const edit = el('button', 'small', '编辑')
        edit.addEventListener('click', () => { showForm(server) })
        const remove = el('button', 'small danger', '删除')
        remove.addEventListener('click', () => { void removeServer(server) })
        actions.append(check, toggle, edit, remove)
        card.append(actions)
        list.append(card)
      }
      syncCheckAllButton()
    }

    function showForm(server) {
      editingId = server ? server.id : null
      $('serverName').value = server ? server.serverName : ''
      $('serverTransport').value = server ? server.transport : 'stdio'
      $('serverCommand').value = (server && server.command) || ''
      $('serverCwd').value = (server && server.cwd) || ''
      $('serverArgs').value = (server && server.args) ? server.args.join('\n') : ''
      $('serverEnv').value = objectToLines(server && server.env, '=')
      $('serverUrl').value = (server && server.url) || ''
      $('serverHeaders').value = objectToLines(server && server.headers, ': ')
      $('serverFailOnStartup').checked = Boolean(server && server.failOnStartupError)
      $('serverEnabled').checked = server ? server.enabled !== false : true
      syncTransportFields()
      $('serverForm').hidden = false
      // New server / empty command: offer the Node the shell ships instead of asking for a path.
      if ($('serverTransport').value === 'stdio') fillNodeCommand()
      $('serverForm').scrollIntoView({ block: 'nearest' })
    }

    function hideForm() {
      editingId = null
      $('serverForm').hidden = true
    }

    function syncTransportFields() {
      const stdio = $('serverTransport').value === 'stdio'
      $('stdioFields').hidden = !stdio
      $('stdioArgsRow').hidden = !stdio
      $('stdioEnvRow').hidden = !stdio
      $('httpFields').hidden = stdio
      $('httpHeadersRow').hidden = stdio
      renderNodeHint()
    }

    async function loadServers() {
      try {
        const state = await api.list()
        servers = (state && state.servers) || []
        $('patchPath').textContent = (state && state.patchPath) || ''
        $('patchPath').title = (state && state.patchPath) || ''
        renderServers()
        // The list is the answer to "is this MCP usable?", not a blank until someone clicks. Enabled
        // servers are checked once in the background; a cached result makes reopening instant.
        void autoCheckEnabled()
      } catch (error) {
        setStatus('读取 MCP 配置失败：' + String(error), 'error')
      }
    }

    async function saveServer() {
      const transport = $('serverTransport').value
      const input = {
        serverName: $('serverName').value.trim(),
        transport,
        enabled: $('serverEnabled').checked,
        failOnStartupError: $('serverFailOnStartup').checked,
        ...(editingId ? { id: editingId } : {}),
      }
      if (transport === 'stdio') {
        // Empty / bare `node` becomes the detected path here as well as in the shell, so what the
        // form shows after saving is what was written.
        const command = normalizeCommand($('serverCommand').value)
        if (command !== '') input.command = command
        const cwd = $('serverCwd').value.trim()
        if (cwd) input.cwd = cwd
        const args = $('serverArgs').value.split(/\r?\n/).map((line) => line.trim()).filter((line) => line !== '')
        if (args.length > 0) input.args = args
        const env = pairsToObject(parseLines($('serverEnv').value, '='))
        if (Object.keys(env).length > 0) input.env = env
      } else {
        input.url = $('serverUrl').value.trim()
        const headers = pairsToObject(parseLines($('serverHeaders').value, ':'))
        if (Object.keys(headers).length > 0) input.headers = headers
      }
      try {
        const result = await api.saveServer(input)
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '保存失败。', 'error')
          return
        }
        hideForm()
        await loadServers()
        setStatus('已保存。重启 DSH 服务后生效。', 'ok')
      } catch (error) {
        setStatus('保存失败：' + String(error), 'error')
      }
    }

    async function setEnabled(id, enabled) {
      try {
        const result = await api.setEnabled(id, enabled)
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '操作失败。', 'error')
          return
        }
        await loadServers()
        setStatus(enabled ? '已启用。重启 DSH 服务后生效。' : '已停用。重启 DSH 服务后生效。', 'ok')
      } catch (error) {
        setStatus('操作失败：' + String(error), 'error')
      }
    }

    async function removeServer(server) {
      if (!window.confirm('删除 MCP 服务「' + server.serverName + '」？此操作会写入 DSH 配置（有备份）。')) return
      try {
        const result = await api.removeServer(server.id)
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '删除失败。', 'error')
          return
        }
        await loadServers()
        setStatus('已删除。重启 DSH 服务后生效。', 'ok')
      } catch (error) {
        setStatus('删除失败：' + String(error), 'error')
      }
    }

    /* ---------- availability: one check, or every server in list order ---------- */

    async function checkOne(id, options) {
      const silent = Boolean(options && options.silent)
      if (probeState.checking.has(id)) return null
      if (!api || typeof api.check !== 'function') {
        if (!silent) setStatus('当前桌面壳不支持检查 MCP 服务，请升级后重试。', 'error')
        return null
      }
      const server = servers.find((item) => item.id === id)
      if (!server) return null
      probeState.checking.add(id)
      renderServers()
      let result = null
      try {
        result = await api.check(id)
        if (!result || typeof result !== 'object') {
          result = { ok: false, transport: server.transport, error: '检查结果无效。', durationMs: 0, checkedAt: Date.now() }
        }
        applyProbeResult(id, result)
        const label = server.serverName || id
        if (!silent) {
          if (result.ok === true) {
            const count = Number(result.toolCount)
            setStatus('「' + label + '」可用：' + (Number.isFinite(count) ? count : 0) + ' 个工具。', 'ok')
          } else {
            setStatus('「' + label + '」不可用：' + (result.error || '未知原因'), 'error')
          }
        }
      } catch (error) {
        result = { ok: false, transport: server.transport, error: String(error), durationMs: 0, checkedAt: Date.now() }
        applyProbeResult(id, result)
        if (!silent) setStatus('检查「' + (server.serverName || id) + '」失败：' + String(error), 'error')
      } finally {
        probeState.checking.delete(id)
        renderServers()
      }
      return result
    }

    /**
     * First render: check every *enabled* server that has no result yet, one at a time.
     *
     * Disabled servers are left for the explicit button: a user who turned one off does not expect the
     * shell to keep spawning it just to colour a badge. Runs once per window session; results live in
     * the main process, so closing/reopening the window does not spawn everything again.
     */
    async function autoCheckEnabled() {
      if (autoCheckStarted) return
      autoCheckStarted = true
      // An import already shows "已导入 N 个…"; the background checks must not overwrite that line.
      const quiet = autoCheckQuiet
      autoCheckQuiet = false
      if (!api || typeof api.check !== 'function') return
      const targets = servers
        .filter((server) => server.enabled !== false && !server.probe)
        .map((server) => server.id)
      if (targets.length === 0) return
      const results = []
      for (const id of targets) {
        if (!servers.some((server) => server.id === id)) continue
        results.push(await checkOne(id, { silent: true }))
      }
      if (quiet) return
      const failed = results.filter((result) => !result || result.ok !== true).length
      setStatus(
        '已自动检查 ' + targets.length + ' 个 MCP 服务' + (failed === 0 ? '，全部可用。' : '，' + failed + ' 个不可用。'),
        failed === 0 ? 'ok' : 'error',
      )
    }

    /** Run one check at a time so five stdio servers do not spawn five processes at once. */
    async function checkAll() {
      if (probeState.batchRunning) return
      if (!api || typeof api.check !== 'function') {
        setStatus('当前桌面壳不支持检查 MCP 服务，请升级后重试。', 'error')
        return
      }
      if (servers.length === 0) return
      const targets = servers.map((server) => server.id)
      probeState.batchRunning = true
      probeState.batchDone = 0
      probeState.batchTotal = targets.length
      renderServers()
      const results = []
      try {
        for (const id of targets) {
          results.push(await checkOne(id))
          probeState.batchDone += 1
          syncCheckAllButton()
        }
        const failed = results.filter((result) => !result || result.ok !== true).length
        setStatus(
          '检查完成：' + targets.length + ' 个服务' + (failed === 0 ? '，全部可用。' : '，' + failed + ' 个不可用。'),
          failed === 0 ? 'ok' : 'error',
        )
      } finally {
        probeState.batchRunning = false
        renderServers()
      }
    }

    /* ---------- import: Codex config.toml / Claude .mcp.json → preview → apply ---------- */

    function importFormatLabel(format) {
      if (format === 'codex') return 'Codex TOML'
      if (format === 'claude') return 'Claude JSON'
      return '未识别格式'
    }

    function importTarget(entry) {
      const input = (entry && entry.input) || {}
      if (input.transport === 'streamable-http') return input.url || ''
      const args = Array.isArray(input.args) ? input.args.join(' ') : ''
      return String(input.command || '') + (args === '' ? '' : ' ' + args)
    }

    function importEntryRow(entry, index) {
      const item = el('div', 'import-item')
      const head = el('label', 'import-head')
      const selected = document.createElement('input')
      selected.type = 'checkbox'
      selected.checked = true
      selected.setAttribute('data-import-select', String(index))
      head.append(selected, el('span', 'import-name', entry.name || '（未命名）'))
      head.append(tag(entry.input && entry.input.transport === 'streamable-http' ? 'streamable-http' : 'stdio'))
      if (entry.input && entry.input.enabled === false) head.append(tag('已停用'))
      head.append(el('span', 'import-target', importTarget(entry)))
      item.append(head)
      if (entry.conflict) {
        const conflict = el('label', 'import-conflict')
        const overwrite = document.createElement('input')
        overwrite.type = 'checkbox'
        overwrite.setAttribute('data-import-overwrite', String(index))
        conflict.append(overwrite, el('span', undefined, '同名已存在，勾选「覆盖」后导入会更新原配置'))
        item.append(conflict)
      }
      if (Array.isArray(entry.warnings) && entry.warnings.length > 0) {
        const warnings = el('ul', 'import-warnings')
        for (const warning of entry.warnings) warnings.append(el('li', undefined, String(warning)))
        item.append(warnings)
      }
      return item
    }

    function renderImportPreview(result) {
      const preview = $('importPreview')
      preview.replaceChildren()
      const errors = Array.isArray(result.errors) ? result.errors : []
      if (errors.length > 0) {
        const list = el('ul', 'import-errors')
        for (const error of errors) list.append(el('li', undefined, String(error)))
        preview.append(list)
      }
      for (const warning of (Array.isArray(result.warnings) ? result.warnings : [])) {
        preview.append(el('p', 'import-warning', warning))
      }
      const entries = Array.isArray(result.entries) ? result.entries : []
      for (const [index, entry] of entries.entries()) preview.append(importEntryRow(entry, index))
      if (entries.length === 0 && errors.length === 0 && (result.warnings || []).length === 0) {
        preview.append(el('p', 'import-empty', '没有可导入的服务。'))
      }
      const status = $('importStatus')
      status.textContent = '识别为 ' + importFormatLabel(result.format) + '：' + entries.length + ' 条可导入'
        + (errors.length === 0 ? '。' : '，' + errors.length + ' 个错误。')
      status.className = errors.length > 0 && entries.length === 0 ? 'error' : ''
      $('importApply').disabled = entries.length === 0 || importState.applying
    }

    /** Selected preview rows → the IPC items the shell writes (renderer state is rebuilt each render). */
    function collectImportItems() {
      const result = importState.result
      if (!result) return []
      const preview = $('importPreview')
      const items = []
      for (const [index, entry] of result.entries.entries()) {
        const selected = preview.querySelector('input[data-import-select="' + index + '"]')
        if (!selected || selected.checked !== true) continue
        const overwrite = preview.querySelector('input[data-import-overwrite="' + index + '"]')
        items.push({ input: entry.input, overwrite: Boolean(entry.conflict && overwrite && overwrite.checked) })
      }
      return items
    }

    function updateImportApplyState() {
      $('importApply').disabled = importState.applying || collectImportItems().length === 0
    }

    function openImport() {
      importState.result = null
      importState.applying = false
      $('importText').value = ''
      $('importStatus').textContent = ''
      $('importStatus').className = ''
      $('importPreview').replaceChildren()
      $('importApply').disabled = true
      $('importModal').hidden = false
      $('importText').focus()
    }

    function closeImport() {
      if (importState.applying) return
      importState.result = null
      $('importModal').hidden = true
      $('importPreview').replaceChildren()
      $('importStatus').textContent = ''
      $('importStatus').className = ''
    }

    async function pickImport() {
      if (!api || typeof api.importPick !== 'function') {
        setStatus('当前桌面壳不支持导入配置，请升级后重试。', 'error')
        return
      }
      const status = $('importStatus')
      status.className = ''
      status.textContent = '正在选择文件…'
      try {
        const result = await api.importPick()
        if (!result || result.ok !== true) {
          if (result && result.reason === '已取消。') {
            status.textContent = ''
            return
          }
          status.textContent = (result && result.reason) || '读取配置文件失败。'
          status.className = 'error'
          return
        }
        $('importText').value = String(result.text || '')
        $('importPreview').replaceChildren()
        $('importApply').disabled = true
        importState.result = null
        status.textContent = '已读取 ' + String(result.fileName || '配置文件') + '，点「解析」查看预览。'
      } catch (error) {
        status.textContent = '读取配置文件失败：' + String(error)
        status.className = 'error'
      }
    }

    async function parseImport() {
      if (!api || typeof api.importParse !== 'function') {
        setStatus('当前桌面壳不支持导入配置，请升级后重试。', 'error')
        return
      }
      const text = $('importText').value
      const status = $('importStatus')
      if (text.trim() === '') {
        status.textContent = '请先粘贴配置内容或从文件选择。'
        status.className = 'error'
        return
      }
      status.textContent = '正在解析…'
      status.className = ''
      $('importApply').disabled = true
      $('importPreview').replaceChildren()
      importState.result = null
      try {
        const raw = await api.importParse(text)
        if (!raw || typeof raw !== 'object') throw new Error('解析结果无效。')
        const result = {
          format: raw.format === 'codex' || raw.format === 'claude' ? raw.format : 'unknown',
          entries: Array.isArray(raw.entries) ? raw.entries : [],
          errors: Array.isArray(raw.errors) ? raw.errors : [],
          warnings: Array.isArray(raw.warnings) ? raw.warnings : [],
        }
        importState.result = result
        renderImportPreview(result)
      } catch (error) {
        status.textContent = '解析失败：' + String(error)
        status.className = 'error'
        $('importApply').disabled = true
      }
    }

    async function applyImportSelection() {
      if (importState.applying) return
      if (!api || typeof api.importApply !== 'function') {
        setStatus('当前桌面壳不支持导入配置，请升级后重试。', 'error')
        return
      }
      const items = collectImportItems()
      if (items.length === 0) {
        $('importStatus').textContent = '没有选中要导入的服务。'
        $('importStatus').className = 'error'
        return
      }
      importState.applying = true
      const status = $('importStatus')
      status.className = ''
      status.textContent = '正在导入…'
      $('importApply').disabled = true
      for (const id of ['importPick', 'importParse', 'importCancel', 'importClose']) $(id).disabled = true
      try {
        const result = await api.importApply(items)
        const imported = Number(result && result.imported) || 0
        const skipped = Number(result && result.skipped) || 0
        const failed = Array.isArray(result && result.failed) ? result.failed : []
        const failures = failed.map((failure) => (failure.name ? failure.name + '：' : '') + String(failure.reason || '未知原因'))
        if (!result || result.ok !== true) {
          status.textContent = failures.length > 0 ? failures.join('；') : '导入失败。'
          status.className = 'error'
          return
        }
        const summary = '已导入 ' + imported + ' 个，跳过 ' + skipped + ' 个，失败 ' + failed.length + ' 个。'
        status.textContent = summary + (failures.length > 0 ? ' ' + failures.join('；') : '')
        status.className = failed.length > 0 ? 'error' : 'ok'
        // A fresh list may contain new servers; let the one-shot auto-check pick them up so the rows
        // show a real availability badge instead of "未检查", without replacing the import summary.
        if (imported > 0) {
          autoCheckStarted = false
          autoCheckQuiet = true
        }
        await loadServers()
        if (imported > 0) {
          importState.result = null
          $('importModal').hidden = true
          setStatus(summary + (failures.length > 0 ? ' ' + failures.join('；') : '') + ' 重启 DSH 服务后生效。', failed.length > 0 ? 'error' : 'ok')
        }
      } catch (error) {
        status.textContent = '导入失败：' + String(error)
        status.className = 'error'
      } finally {
        importState.applying = false
        for (const id of ['importPick', 'importParse', 'importCancel', 'importClose']) $(id).disabled = false
        if (!$('importModal').hidden) updateImportApplyState()
      }
    }

    let skillState = { libraryRoot: '', publications: [], groups: [], library: [], scope: 'all', updates: {}, checking: false, updating: '' }

    function samePath(left, right) {
      return String(left || '').toLowerCase() === String(right || '').toLowerCase()
    }

    function skillRootLabel(root) {
      return root === 'agents' ? '.agents' : '.dsh'
    }

    function projectScopeKey(projectRoot) {
      return 'project:' + String(projectRoot || '').toLowerCase()
    }

    function scopeMatches(scope, group) {
      if (scope === 'all') return true
      if (scope === 'global') return group.kind === 'global'
      return group.kind === 'project' && projectScopeKey(group.projectRoot) === scope
    }

    function renderSkillScopes(groups, library) {
      const bar = $('skillScopes')
      bar.replaceChildren()
      const projects = new Map()
      let globalCount = 0
      let allCount = 0
      for (const group of groups) {
        const count = Array.isArray(group.items) ? group.items.length : 0
        allCount += count
        if (group.kind === 'global') globalCount += count
        else if (group.projectRoot) projects.set(projectScopeKey(group.projectRoot), group.projectTitle || '项目')
      }
      const add = (key, label, count) => {
        const button = el('button', null, label + ' ' + count)
        button.type = 'button'
        button.classList.toggle('active', skillState.scope === key)
        button.addEventListener('click', () => {
          skillState.scope = key
          renderSkills(skillState)
        })
        bar.append(button)
      }
      add('all', '全部', allCount)
      add('library', '本地库', library.length)
      add('global', '全局', globalCount)
      for (const [key, title] of projects) {
        let count = 0
        for (const group of groups) if (scopeMatches(key, group)) count += group.items.length
        add(key, title, count)
      }
      if (![...bar.children].some((button) => button.classList.contains('active'))) skillState.scope = 'all'
    }

    function renderSkillGroups(groups) {
      const list = skillState.groupHost
      if (!list) return
      list.replaceChildren()
      const visible = groups.filter((group) => scopeMatches(skillState.scope, group))
      const hasInstalled = visible.some((group) => group.items.length > 0)
      if (!hasInstalled) {
        list.append(el('div', 'empty', '这个范围内还没有已安装的 Skill。'))
        return
      }
      for (const group of visible) {
        if (group.items.length === 0) continue
        const head = el('div', 'scope-head')
        const title = group.kind === 'global'
          ? '全局 · ' + skillRootLabel(group.root)
          : (group.projectTitle || '项目') + ' · ' + skillRootLabel(group.root)
        head.append(el('span', null, title))
        head.append(tag(skillRootLabel(group.root)))
        head.append(el('code', null, group.path))
        list.append(head)
        for (const skill of group.items) {
          const card = el('div', 'card')
          const grow = el('div', 'grow')
          const name = el('div', 'name', skill.name)
          name.append(tag(skill.linked ? '链接' : '目录', skill.linked ? 'ok' : ''))
          grow.append(name)
          if (skill.description) grow.append(el('div', 'desc', skill.description))
          grow.append(el('div', 'summary', skill.path))
          card.append(grow)
          const actions = el('div', 'actions')
          const remove = el('button', 'small danger', '删除')
          remove.title = skill.linked ? '只删除这个链接，不动源目录。' : '删除磁盘上的技能目录，无法恢复。'
          remove.addEventListener('click', () => { void removeInstalledSkill(skill) })
          actions.append(remove)
          card.append(actions)
          list.append(card)
        }
      }
    }

    async function removeInstalledSkill(skill) {
      const message = skill.linked
        ? '删除 Skill 链接「' + skill.name + '」？只删除链接，不动源目录。'
        : '删除 Skill「' + skill.name + '」？这会删除磁盘上的技能目录，无法恢复。'
      if (!window.confirm(message)) return
      try {
        const result = await api.removeSkillEntry(skill.path)
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '删除失败。', 'error')
          return
        }
        await loadSkills()
        setStatus('已删除 Skill。', 'ok')
      } catch (error) {
        setStatus('删除失败：' + String(error), 'error')
      }
    }

    function renderSkills(state) {
      const library = (state && state.library) || []
      const publications = (state && state.publications) || []
      const groups = (state && state.groups) || []
      skillState = {
        libraryRoot: (state && state.libraryRoot) || '',
        publications,
        groups,
        library,
        workspaces: (state && state.workspaces) || [],
        scope: skillState.scope || 'all',
        updates: skillState.updates || {},
        checking: Boolean(skillState.checking),
        updating: skillState.updating || '',
      }
      $('libraryHint').textContent = state && state.libraryRoot
        ? '本地库：' + state.libraryRoot + '。发布只创建指向本地库的 junction，不复制源文件。'
        : ''
      renderSkillScopes(groups, library)
      const list = $('skillList')
      list.replaceChildren()
      if (skillState.scope === 'library') {
        if (library.length === 0) {
          list.append(el('div', 'empty', '本地 Skill 库还是空的；可以从市场安装或点「添加到本地库」。'))
          return
        }
        const head = el('div', 'scope-head')
        head.append(el('span', null, '本地库（未发布）'))
        head.append(tag('独立于已安装 Skill'))
        list.append(head)
        const libraryGroup = el('div', 'skill-group')
        for (const skill of library) {
          const card = el('div', 'card')
          const grow = el('div', 'grow')
          const name = el('div', 'name', skill.name)
          name.append(tag('本地库'))
          const update = skillState.updates[skill.name]
          if (update && update.updateAvailable) name.append(tag('可更新', 'ok'))
          grow.append(name)
          if (skill.description) grow.append(el('div', 'desc', skill.description))
          grow.append(el('div', 'summary', skill.path))
          const source = skill.source
          const version = skill.version || (source && source.version) || (source && source.commit ? source.commit.slice(0, 8) : '')
          const sourceRow = el('div', 'summary')
          sourceRow.textContent = source
            ? '来源：' + source.id + ' · 版本 ' + (version || '未标注') + (source.commit ? ' · ' + source.commit.slice(0, 8) : '')
            : '版本 ' + (version || '未标注') + ' · 来源未记录（重新从市场安装后可检查更新）'
          grow.append(sourceRow)
          if (update) {
            if (update.error) grow.append(el('div', 'desc', '检查更新失败：' + update.error))
            else if (update.updateAvailable) grow.append(el('div', 'desc', '有新版本：' + (update.latest || '未知') + ' → 可更新'))
            else grow.append(el('div', 'desc', '已是最新版本。'))
          }
          const pubs = publications.filter((item) => samePath(item.name, skill.name))
          for (const pub of pubs) {
            const row = el('div', 'publication')
            const root = skillRootLabel(pub.root)
            row.append(el('span', null, (pub.kind === 'global' ? '已发布到全局' : '已发布到项目') + ' · ' + root + '：'))
            row.append(el('code', null, pub.target))
            const undo = el('button', 'small danger', '取消发布')
            undo.addEventListener('click', () => { void unpublishSkill(pub) })
            row.append(undo)
            grow.append(row)
          }
          card.append(grow)
          const actions = el('div', 'actions')
          for (const root of ['dsh', 'agents']) {
            const global = el('button', 'small', '发布到全局 · ' + skillRootLabel(root))
            global.addEventListener('click', () => { void publishSkill(skill, 'global', root) })
            actions.append(global)
          }
          const project = el('button', 'small', '发布到项目…')
          project.addEventListener('click', () => { void publishSkill(skill, 'project', 'dsh') })
          actions.append(project)
          if (update && update.updateAvailable) {
            const updateButton = el('button', 'small primary', skillState.updating === skill.name ? '更新中…' : '更新')
            updateButton.disabled = skillState.updating !== ''
            updateButton.addEventListener('click', () => { void updateSkill(skill) })
            actions.append(updateButton)
          }
          const remove = el('button', 'small danger', '从本地库删除')
          remove.disabled = pubs.length > 0
          remove.title = pubs.length > 0 ? '请先取消所有发布，再删除本地库副本。' : '删除本地库里的这份 Skill 源文件。'
          remove.addEventListener('click', () => { void removeLibrarySkill(skill) })
          actions.append(remove)
          card.append(actions)
          libraryGroup.append(card)
        }
        list.append(libraryGroup)
        return
      }
      const groupHost = el('div', 'skill-group')
      list.append(groupHost)
      skillState.groupHost = groupHost
      renderSkillGroups(groups)
    }

    async function checkSkillUpdates() {
      if (skillState.checking) return
      skillState.checking = true
      renderSkills(skillState)
      try {
        const result = await api.checkSkillUpdates()
        const items = (result && Array.isArray(result.items)) ? result.items : []
        const updates = {}
        for (const item of items) if (item && typeof item.name === 'string') updates[item.name] = item
        skillState.updates = updates
        const pending = items.filter((item) => item && item.updateAvailable).length
        setStatus(pending > 0 ? '发现 ' + pending + ' 个可更新的 Skill。' : '本地库里的 Skill 都是最新版本。', 'ok')
      } catch (error) {
        setStatus('检查更新失败：' + String(error), 'error')
      } finally {
        skillState.checking = false
        renderSkills(skillState)
      }
    }

    async function updateSkill(skill) {
      if (skillState.updating !== '') return
      skillState.updating = skill.name
      renderSkills(skillState)
      try {
        const result = await api.updateSkill(skill.name)
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '更新失败。', 'error')
          return
        }
        setStatus(result.updated === true ? '已更新：' + skill.name : '已经是最新版本。', 'ok')
        skillState.updates = {}
        await loadSkills()
        await checkSkillUpdates()
      } catch (error) {
        setStatus('更新失败：' + String(error), 'error')
      } finally {
        skillState.updating = ''
        renderSkills(skillState)
      }
    }

    async function loadSkills() {
      try {
        const state = await api.skills()
        $('skillsRoot').textContent = (state && state.skillsRoot) || ''
        $('skillsRoot').title = (state && state.skillsRoot) || ''
        renderSkills(state)
      } catch (error) {
        setStatus('读取 Skills 失败：' + String(error), 'error')
      }
    }

    async function importSkill() {
      try {
        const result = await api.importSkill()
        if (!result || result.ok !== true) {
          if (result && result.reason === '已取消。') { setStatus(''); return }
          setStatus((result && result.reason) || '添加失败。', 'error')
          return
        }
        await loadSkills()
        setStatus('已复制到壳的本地 Skill 库；发布时再创建链接。', 'ok')
      } catch (error) {
        setStatus('添加失败：' + String(error), 'error')
      }
    }

    let pendingPublish = null

    function openPublishDialog(skill, root) {
      const projects = new Map()
      for (const group of skillState.groups || []) {
        if (group.kind === 'project' && group.projectRoot) projects.set(group.projectRoot, group.projectTitle || group.projectRoot)
      }
      if (projects.size === 0) {
        setStatus('还没有可用于发布的项目，先在 DSH 里添加工作区。', 'error')
        return
      }
      pendingPublish = skill
      const select = $('publishProject')
      select.replaceChildren()
      for (const [path, title] of projects) {
        const option = document.createElement('option')
        option.value = path
        option.textContent = title + ' — ' + path
        select.append(option)
      }
      $('publishRoot').value = root === 'agents' ? 'agents' : 'dsh'
      $('publishSkillName').textContent = '发布「' + skill.name + '」：只创建指向本地库的 junction，不复制源文件。'
      $('publishModal').hidden = false
    }

    async function confirmPublish() {
      if (!pendingPublish) return
      const projectRoot = $('publishProject').value
      const root = $('publishRoot').value === 'agents' ? 'agents' : 'dsh'
      const name = pendingPublish.name
      $('publishConfirm').disabled = true
      try {
        const result = await api.publishSkill(name, { kind: 'project', projectRoot, root })
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '发布失败。', 'error')
          return
        }
        $('publishModal').hidden = true
        pendingPublish = null
        await loadSkills()
        setStatus('已发布：' + (result.target || ''), 'ok')
      } catch (error) {
        setStatus('发布失败：' + String(error), 'error')
      } finally {
        $('publishConfirm').disabled = false
      }
    }

    async function publishSkill(skill, kind, root) {
      if (kind === 'project') {
        openPublishDialog(skill, root)
        return
      }
      try {
        const result = await api.publishSkill(skill.name, { kind, root })
        if (!result || result.ok !== true) {
          if (result && result.reason === '已取消。') { setStatus(''); return }
          setStatus((result && result.reason) || '发布失败。', 'error')
          return
        }
        await loadSkills()
        setStatus('已发布：' + (result.target || ''), 'ok')
      } catch (error) {
        setStatus('发布失败：' + String(error), 'error')
      }
    }

    async function unpublishSkill(publication) {
      if (!window.confirm('取消发布「' + publication.name + '」？只删除链接，不动本地库。')) return
      try {
        const result = await api.unpublishSkill(publication.name, publication.target)
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '取消发布失败。', 'error')
          return
        }
        await loadSkills()
        setStatus('已取消发布。', 'ok')
      } catch (error) {
        setStatus('取消发布失败：' + String(error), 'error')
      }
    }

    async function removeSkill(skill) {
      if (!window.confirm('移除 Skill 链接「' + skill.name + '」？只删除链接，不动原目录。')) return
      try {
        const result = await api.removeSkill(skill.name)
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '移除失败。', 'error')
          return
        }
        await loadSkills()
        setStatus('已移除链接。', 'ok')
      } catch (error) {
        setStatus('移除失败：' + String(error), 'error')
      }
    }

    async function removeLibrarySkill(skill) {
      if (!window.confirm('从壳的本地库删除「' + skill.name + '」？已安装到全局/项目的链接必须先取消发布。')) return
      try {
        const result = await api.removeLibrarySkill(skill.name)
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '删除失败。', 'error')
          return
        }
        await loadSkills()
        setStatus('已从本地库删除。', 'ok')
      } catch (error) {
        setStatus('删除失败：' + String(error), 'error')
      }
    }

    let marketDetail = null

    function installsText(value) {
      if (typeof value === 'string') return value.trim() === '' ? '—' : value
      const number = Number(value)
      return Number.isFinite(number) && number > 0 ? number.toLocaleString() : '—'
    }

    function renderMarket(skills) {
      const list = $('marketResults')
      list.replaceChildren()
      if (!skills || skills.length === 0) {
        list.append(el('div', 'empty', '没有找到 Skill。换一个关键词试试。'))
        return
      }
      for (const skill of skills) {
        const card = el('div', 'card')
        const grow = el('div', 'grow')
        const name = el('div', 'name', skill.name)
        name.append(tag('skills.sh'))
        grow.append(name)
        grow.append(el('div', 'summary', skill.id))
        grow.append(el('div', 'summary', '安装量：' + installsText(skill.installs)))
        const actions = el('div', 'actions')
        const install = el('button', 'small primary', '安装')
        install.addEventListener('click', () => { void installFromMarket(skill.id) })
        actions.append(install)
        const view = el('button', 'small', '详情')
        view.addEventListener('click', () => { void showMarketDetail(skill.id) })
        actions.append(view)
        const open = el('button', 'small', '打开')
        open.addEventListener('click', () => { void openMarket(skill.url) })
        actions.append(open)
        card.append(grow, actions)
        list.append(card)
      }
    }

    async function searchMarket() {
      const query = $('marketQuery').value.trim()
      if (query.length < 2) {
        setStatus('搜索词至少 2 个字符。', 'error')
        return
      }
      setStatus('正在搜索 skills.sh…')
      closeMarketDetail()
      $('marketResults').replaceChildren()
      try {
        const result = await api.marketSearch(query, 60)
        const skills = (result && result.skills) || []
        renderMarket(skills)
        setStatus('找到 ' + skills.length + ' 个 Skill。', 'ok')
      } catch (error) {
        setStatus('搜索失败：' + String(error), 'error')
      }
    }

    async function showMarketDetail(id) {
      const box = $('marketDetail')
      const dialog = $('marketDetailDialog')
      if (!dialog.open) dialog.showModal()
      box.replaceChildren(el('div', 'empty', '正在读取详情…'))
      try {
        const detail = await api.marketDetail(id)
        marketDetail = detail
        box.replaceChildren()
        const title = el('div', 'name', detail.name || id)
        title.append(tag('skills.sh'))
        box.append(title)
        box.append(el('div', 'summary', detail.id || id))
        if (detail.description) box.append(el('div', 'desc', detail.description))
        const metrics = el('div', 'market-metrics',
          '安装：' + installsText(detail.installs) + ' · ★ ' + installsText(detail.stars) +
          (detail.repository ? ' · ' + detail.repository : ''))
        box.append(metrics)
        if (detail.installCommand) {
          const command = el('div', 'command')
          command.append(el('code', null, detail.installCommand))
          const copy = el('button', 'small', '复制')
          copy.addEventListener('click', () => { void copyMarketCommand(detail.installCommand) })
          command.append(copy)
          box.append(command)
        }
        const actions = el('div', 'actions')
        const install = el('button', 'small primary', '安装…')
        install.addEventListener('click', () => { openInstallDialog(detail) })
        actions.append(install)
        const repo = el('button', 'small', '打开 skills.sh')
        repo.addEventListener('click', () => { if (detail.url) void openMarket(detail.url) })
        actions.append(repo)
        const close = el('button', 'small', '关闭')
        close.addEventListener('click', closeMarketDetail)
        actions.append(close)
        box.append(actions)
      } catch (error) {
        box.replaceChildren(el('div', 'empty', '读取详情失败：' + String(error)))
      }
    }

    function closeMarketDetail() {
      marketDetail = null
      const dialog = $('marketDetailDialog')
      if (dialog.open) dialog.close()
      $('marketDetail').replaceChildren()
    }

    async function installFromMarket(id) {
      try {
        const detail = await api.marketDetail(id)
        closeMarketDetail()
        openInstallDialog(detail)
      } catch (error) {
        setStatus('读取安装信息失败：' + String(error), 'error')
      }
    }

    let installDetail = null
    let installTargets = []

    function openInstallDialog(detail) {
      installDetail = detail
      installTargets = [
        { kind: 'global', root: 'dsh', label: '全局 · .dsh/skills' },
        { kind: 'global', root: 'agents', label: '全局 · .agents/skills' },
      ]
      for (const workspace of skillState.workspaces || []) {
        installTargets.push({ kind: 'project', root: 'agents', projectRoot: workspace.path, label: workspace.title + ' · .agents/skills' })
      }
      const select = $('installScope')
      select.replaceChildren()
      installTargets.forEach((target, index) => {
        const option = document.createElement('option')
        option.value = String(index)
        option.textContent = target.label
        select.append(option)
      })
      $('installSkillName').textContent = '安装「' + (detail.name || detail.id) + '」；会先复制到壳的本地 Skill 库，再发布到所选位置。'
      $('installTrust').checked = false
      $('installConfirm').disabled = true
      $('installModal').hidden = false
    }

    async function confirmInstall() {
      if (!installDetail || !$('installTrust').checked) return
      const target = installTargets[Number($('installScope').value)]
      if (!target) return
      $('installConfirm').disabled = true
      $('installCancel').disabled = true
      setStatus('正在下载并安装…')
      try {
        const result = await api.marketInstall(installDetail.id, {
          kind: target.kind,
          root: target.root,
          ...(target.projectRoot ? { projectRoot: target.projectRoot } : {}),
        })
        if (!result || result.ok !== true) {
          setStatus((result && result.reason) || '安装失败。', 'error')
          return
        }
        $('installModal').hidden = true
        installDetail = null
        await loadSkills()
        setStatus('已安装：' + (result.target || result.name || ''), 'ok')
      } catch (error) {
        setStatus('安装失败：' + String(error), 'error')
      } finally {
        $('installConfirm').disabled = false
        $('installCancel').disabled = false
      }
    }

    async function copyMarketCommand(text) {
      try {
        await navigator.clipboard.writeText(text)
        setStatus('安装命令已复制。', 'ok')
      } catch {
        setStatus('复制失败，请手动选择命令复制。', 'error')
      }
    }

    async function openMarket(url) {
      try {
        const result = await api.openExternal(url)
        if (result && result.ok !== true) setStatus((result && result.reason) || '打开失败。', 'error')
      } catch (error) {
        setStatus('打开失败：' + String(error), 'error')
      }
    }

    async function restart() {
      if (!window.confirm('重启 DSH 服务会结束当前所有运行中的会话（历史已保存），继续？')) return
      setStatus('正在重启…')
      try {
        await api.restart()
      } catch (error) {
        setStatus('重启失败：' + String(error), 'error')
      }
    }

    function switchTab(name) {
      $('tabMcp').classList.toggle('active', name === 'mcp')
      $('tabSkills').classList.toggle('active', name === 'skills')
      $('tabMarket').classList.toggle('active', name === 'market')
      $('panelMcp').classList.toggle('active', name === 'mcp')
      $('panelSkills').classList.toggle('active', name === 'skills')
      $('panelMarket').classList.toggle('active', name === 'market')
      if (name === 'skills') void loadSkills()
    }

    function wire() {
      $('tabMcp').addEventListener('click', () => { switchTab('mcp') })
      $('tabSkills').addEventListener('click', () => { switchTab('skills') })
      $('tabMarket').addEventListener('click', () => { switchTab('market') })
      $('addServer').addEventListener('click', () => { showForm(null) })
      $('importMcp').addEventListener('click', openImport)
      $('importClose').addEventListener('click', closeImport)
      $('importCancel').addEventListener('click', closeImport)
      $('importModal').addEventListener('mousedown', (event) => {
        if (event.target === $('importModal')) closeImport()
      })
      $('importPick').addEventListener('click', () => { void pickImport() })
      $('importParse').addEventListener('click', () => { void parseImport() })
      $('importApply').addEventListener('click', () => { void applyImportSelection() })
      $('importPreview').addEventListener('change', updateImportApplyState)
      $('publishClose').addEventListener('click', () => { $('publishModal').hidden = true; pendingPublish = null })
      $('publishCancel').addEventListener('click', () => { $('publishModal').hidden = true; pendingPublish = null })
      $('publishConfirm').addEventListener('click', () => { void confirmPublish() })
      $('installClose').addEventListener('click', () => { $('installModal').hidden = true; installDetail = null })
      $('installCancel').addEventListener('click', () => { $('installModal').hidden = true; installDetail = null })
      $('installTrust').addEventListener('change', () => { $('installConfirm').disabled = !$('installTrust').checked })
      $('installConfirm').addEventListener('click', () => { void confirmInstall() })
      $('installModal').addEventListener('mousedown', (event) => {
        if (event.target === $('installModal')) {
          $('installModal').hidden = true
          installDetail = null
        }
      })
      $('publishModal').addEventListener('mousedown', (event) => {
        if (event.target === $('publishModal')) {
          $('publishModal').hidden = true
          pendingPublish = null
        }
      })
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !$('importModal').hidden) {
          event.preventDefault()
          closeImport()
        } else if (event.key === 'Escape' && !$('publishModal').hidden) {
          event.preventDefault()
          $('publishModal').hidden = true
          pendingPublish = null
        } else if (event.key === 'Escape' && !$('installModal').hidden) {
          event.preventDefault()
          $('installModal').hidden = true
          installDetail = null
        }
      })
      $('refreshMcp').addEventListener('click', () => { void loadServers() })
      $('checkAll').addEventListener('click', () => { void checkAll() })
      $('serverTransport').addEventListener('change', syncTransportFields)
      $('detectNode').addEventListener('click', () => { void detectNode() })
      $('cancelServer').addEventListener('click', hideForm)
      $('saveServer').addEventListener('click', () => { void saveServer() })
      $('importSkill').addEventListener('click', () => { void importSkill() })
      $('checkSkillUpdates').addEventListener('click', () => { void checkSkillUpdates() })
      $('refreshSkills').addEventListener('click', () => { void loadSkills() })
      $('marketSearch').addEventListener('click', () => { void searchMarket() })
      $('marketQuery').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault()
          void searchMarket()
        }
      })
      $('restartButton').addEventListener('click', () => { void restart() })
      $('closeButton').addEventListener('click', () => { void api.close() })
    }

    if (!api) {
      $('statusBar').textContent = '页面未获得桌面壳 API（preload 未加载）'
      $('statusBar').className = 'error'
    } else {
      wire()
      void loadServers()
      void loadNode()
    }
  </script>
</body>
</html>
